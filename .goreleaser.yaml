version: 2

project_name: omathunder

builds:
  - id: omathunder
    main: ./cmd/omathunder
    binary: omathunder
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

brews:
  - name: omathunder
    repository:
      owner: fhess
      name: homebrew-tap
    homepage: "https://github.com/fhess/omathunder"
    description: "Live Omarchy theme sync and multi-stage Gemini/Claude/Ollama AI triage companion for Thunderbird"
    license: "MIT"
    install: |
      bin.install "omathunder"
    caveats: |
      Run once to register the Thunderbird Native Messaging Host (non-destructive):
        omathunder setup
      To uninstall cleanly:
        omathunder uninstall && brew uninstall omathunder
