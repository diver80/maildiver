<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>OmaThunder Popup</title>
  <link rel="stylesheet" href="common.css" />
  <style id="oma-dynamic-vars"></style>
  <style>
    body { width: 380px; padding: 12px 14px; }
    body.is-window { width: 100%; max-width: 560px; margin: 0 auto; padding: 14px 16px; }

    .hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .hdr-left { display: flex; align-items: center; gap: 7px; font-weight: 700; min-width: 0; }
    .hdr-left img { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
    .hdr-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

    .icon-btn {
      padding: 4px 8px; font-size: 11px; border-radius: 6px;
      border: 1px solid var(--oma-border); background: var(--oma-bg-elevated);
      color: var(--oma-fg); cursor: pointer; font-weight: 500;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .icon-btn:hover { background: var(--oma-selection); border-color: var(--oma-accent); }

    .sel-card { margin-bottom: 10px; padding: 9px 11px; }
    .sel-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sel-title { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
    .sel-sub { font-size: 11px; color: var(--oma-fg-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .pills { display: flex; flex-wrap: wrap; gap: 4px; }
    .pill {
      padding: 3px 7px; border-radius: 5px; font-size: 10.5px;
      border: 1px solid var(--oma-border); background: var(--oma-bg-dark); cursor: pointer;
    }
    .pill.active { border-color: var(--oma-accent); background: var(--oma-selection); font-weight: 600; }

    .popup-tabs {
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
      padding: 3px; border-radius: 8px; margin-bottom: 10px;
      background: var(--oma-bg-darker); border: 1px solid var(--oma-border);
    }
    .popup-tab {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 6px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
      border: none; background: transparent; color: var(--oma-fg-muted); cursor: pointer;
      transition: background 120ms ease, color 120ms ease;
    }
    .popup-tab:hover { color: var(--oma-fg); }
    .popup-tab.active {
      background: var(--oma-bg-elevated); color: var(--oma-fg);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--oma-accent) 45%, var(--oma-border));
    }
    .tab-dot {
      width: 7px; height: 7px; border-radius: 999px;
      background: var(--oma-green); display: none;
    }
    .tab-dot.visible { display: inline-block; }
    .tab-dot.loading { background: var(--oma-accent); animation: oma-pulse 1s infinite ease-in-out; }
    @keyframes oma-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .tab-panel:focus { outline: none; }

    .ask-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .ask-row input { flex: 1; padding: 6px 9px; font-size: 12px; }

    .primary-actions { display: flex; flex-direction: column; gap: 7px; }
    .btn-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .oma-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    details.more-details {
      margin-top: 9px;
      border: 1px solid var(--oma-border);
      border-radius: 8px;
      background: var(--oma-bg-darker);
      padding: 0;
    }
    details.more-details > summary {
      list-style: none;
      cursor: pointer;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--oma-fg-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
    }
    details.more-details > summary::-webkit-details-marker { display: none; }
    details.more-details > summary::after {
      content: "▸";
      font-size: 11px;
      transition: transform 120ms ease;
    }
    details.more-details[open] > summary::after { transform: rotate(90deg); }
    details.more-details[open] > summary {
      color: var(--oma-fg);
      border-bottom: 1px solid var(--oma-border);
    }
    .more-body { padding: 9px 10px; display: flex; flex-direction: column; gap: 8px; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .stat { background: var(--oma-bg-elevated); border: 1px solid var(--oma-border); border-radius: 6px; padding: 7px 9px; display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .stat-num { font-size: 15px; font-weight: 700; font-family: var(--oma-mono); }
    .stat-lbl { font-size: 11px; color: var(--oma-fg-muted); }

    .summary-box { max-height: 390px; overflow-y: auto; padding-right: 2px; }
    body.is-window .summary-box { max-height: none; }

    .sug-box { border: 1px solid var(--oma-border); border-radius: 6px; padding: 8px 10px; background: var(--oma-bg-darker); margin-top: 8px; font-size: 11.5px; }
    .cond-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .cond-chip {
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px;
      border-radius: 4px; font-size: 10.5px; font-family: var(--oma-mono);
      border: 1px solid var(--oma-border); background: var(--oma-bg-dark);
    }
    .cond-chip.hit { border-color: color-mix(in srgb, var(--oma-green) 55%, var(--oma-border)); color: var(--oma-green); }
    .cond-chip.miss { border-color: color-mix(in srgb, var(--oma-red) 45%, var(--oma-border)); color: var(--oma-fg-muted); }
  </style>
</head>
<body>
  <div class="hdr">
    <div class="hdr-left">
      <img src="../icons/icon.svg" alt="" />
      <span>OmaThunder</span>
      <span class="oma-badge warn" id="popup-readonly" style="display:none;" data-i18n="badge_readonly">Read-only</span>
    </div>
    <div class="hdr-right">
      <span class="oma-badge ok" id="popup-status" data-i18n="popup_ready">Bereit</span>
      <button class="icon-btn" id="btn-open-space" data-i18n="popup_tab_short" title="OmaThunder-Tab öffnen">Spaces</button>
      <button class="icon-btn" id="btn-open-opts" aria-label="Einstellungen" title="Einstellungen">⚙</button>
    </div>
  </div>

  <div class="oma-card sel-card" id="popup-ai-card">
    <div class="sel-top">
      <div class="sel-title" id="popup-sel-title" data-i18n="popup_sel_none">Keine Mail ausgewählt</div>
      <div class="pills" id="popup-lang-pills">
        <button class="pill active" data-target-lang="" data-i18n="popup_lang_auto">Auto</button>
        <button class="pill" data-target-lang="de" data-i18n="popup_lang_de">DE</button>
        <button class="pill" data-target-lang="en" data-i18n="popup_lang_en">EN</button>
      </div>
    </div>
    <div class="sel-sub" id="popup-sel-sub" style="display:none;"></div>
  </div>

  <div class="popup-tabs" role="tablist">
    <button class="popup-tab active" role="tab" id="tab-actions" data-tab="actions" aria-selected="true" data-i18n="popup_tab_actions">Aktionen</button>
    <button class="popup-tab" role="tab" id="tab-result" data-tab="result" aria-selected="false">
      <span id="tab-result-label" data-i18n="popup_tab_summary">Zusammenfassung</span>
      <span class="tab-dot" id="tab-result-dot"></span>
    </button>
  </div>

  <section class="tab-panel active" id="panel-actions" role="tabpanel" aria-labelledby="tab-actions">
    <div id="popup-ai-primary">
      <div class="ask-row">
        <input class="oma-input" id="popup-question" type="text" data-i18n-ph="popup_question_ph" />
        <button class="oma-btn" id="btn-ask-mail" style="padding:6px 11px; font-size:12px;" data-i18n="popup_btn_ask">Fragen</button>
      </div>
      <div class="primary-actions">
        <button class="oma-btn primary" id="btn-analyze-mail" style="justify-content:center;" data-i18n="popup_summarize_one">Mail / Thread zusammenfassen</button>
        <button class="oma-btn" id="btn-draft-reply" style="justify-content:center;" data-i18n="popup_draft_reply">Antwort formulieren</button>
      </div>
    </div>

    <details class="more-details" id="popup-more-details">
      <summary data-i18n="popup_more_options">Weitere Optionen &amp; Themes</summary>
      <div class="more-body">
        <div id="popup-ai-extras" style="display:flex; flex-direction:column; gap:7px;">
          <div class="btn-row-2">
            <button class="oma-btn" id="btn-extract-ics" style="justify-content:center; font-size:11.5px; padding:6px 8px;" data-i18n="popup_extract_ics">Termine (.ics)</button>
            <button class="oma-btn" id="btn-suggest-filter" style="justify-content:center; font-size:11.5px; padding:6px 8px;" data-i18n="popup_suggest_filter">Filterregel vorschlagen</button>
          </div>
          <button class="oma-btn" id="btn-diagnose-filter" style="justify-content:center; font-size:11.5px; padding:6px 8px;" data-i18n="popup_diagnose_filter">Filter-Diagnose (Warum?)</button>
        </div>

        <div id="quick-theme-card">
          <div class="oma-muted" style="font-size:11px; margin-bottom:5px;" data-i18n="popup_quick_theme">Schnell-Theme (live, ohne Neustart)</div>
          <div class="pills" id="quick-themes"></div>
        </div>

        <div class="grid-2" id="stats-grid">
          <div class="stat"><div class="stat-lbl" data-i18n="popup_action_needed">Action nötig</div><div class="stat-num" id="st-action">2</div></div>
          <div class="stat"><div class="stat-lbl" data-i18n="popup_open_proposals">Offene Proposals</div><div class="stat-num" id="st-proposals">2</div></div>
        </div>
      </div>
    </details>
  </section>

  <section class="tab-panel" id="panel-result" role="tabpanel" aria-labelledby="tab-result" tabindex="-1">
    <div id="popup-out">
      <div class="oma-card oma-muted" id="popup-empty-result" style="font-size:12px;" data-i18n="popup_result_empty">Noch kein Ergebnis. Starte unter „Aktionen“ eine Zusammenfassung oder Rückfrage.</div>
    </div>
  </section>

  <script src="../lib/core.js"></script>
  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
