<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>OmaThunder</title>
  <link rel="stylesheet" href="common.css" />
  <style id="oma-dynamic-vars"></style>
  <style>
    body { max-width: 780px; margin: 22px auto; padding: 0 18px 40px; }
    .opts-hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .opts-hdr-actions { display: flex; align-items: center; gap: 10px; }
    .save-status { font-size: 12px; }
    .save-status.ok { color: var(--oma-green); }
    .save-status.err { color: var(--oma-red); }
    .section { margin-bottom: 16px; }
    .field { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: center; margin-top: 10px; }
    .title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .check { display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; cursor: pointer; }
    .check input { margin-top: 3px; }
    .check-sub { font-size: 11.5px; margin-top: 2px; }
    .accounts { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 360px; overflow-y: auto; }
    .account-row { border: 1px solid var(--oma-border); border-radius: 6px; background: var(--oma-bg-darker); padding: 7px 10px; }
    .account-row label.check { margin-top: 0; }
    .status-row { display: grid; grid-template-columns: 220px 1fr; gap: 12px; align-items: start; margin-top: 8px; }
    .safety { border-left: 3px solid var(--oma-yellow); padding-left: 12px; }
    .bridge-warn { color: var(--oma-yellow); }
    code { font-size: 12px; }
  </style>
</head>
<body>
  <div class="opts-hdr">
    <div style="display:flex; align-items:center; gap:10px;">
      <img src="../icons/icon.svg" width="32" height="32" style="border-radius:7px;" alt="" />
      <div>
        <div style="font-size:18px; font-weight:700;" data-i18n="opts_title">OmaThunder</div>
        <div class="oma-muted" data-i18n="opts_subtitle"></div>
      </div>
    </div>
    <div class="opts-hdr-actions">
      <span id="save-status" class="save-status oma-muted"></span>
      <button class="oma-btn primary" id="btn-save" data-i18n="opts_save">Speichern</button>
    </div>
  </div>

  <div class="oma-card section">
    <div class="title" data-i18n="opts_sec_status">Status</div>
    <div id="status-rows"></div>
    <div class="oma-muted check-sub" style="margin-top:12px;" data-i18n-html="opts_app_hint"></div>
  </div>

  <div class="oma-card section">
    <div class="title" data-i18n="opts_sec_bridge">OmaThunder-App</div>
    <label class="check" style="margin-top:0;">
      <input type="checkbox" id="bridge-enabled" />
      <span>
        <strong data-i18n="opts_bridge_enabled"></strong>
        <div class="oma-muted check-sub" data-i18n="opts_bridge_desc"></div>
      </span>
    </label>
    <label class="check" id="bridge-send-row">
      <input type="checkbox" id="bridge-allow-send" />
      <span>
        <span data-i18n="opts_bridge_send"></span>
        <div class="check-sub bridge-warn" data-i18n="opts_bridge_send_desc"></div>
      </span>
    </label>
  </div>

  <div class="oma-card section">
    <div class="title" data-i18n="opts_sec_rights">Konten &amp; Rechte</div>
    <div class="safety">
      <label class="check" style="margin-top:0;">
        <input type="checkbox" id="mb-readonly" />
        <span><strong data-i18n="opts_readonly"></strong><div class="oma-muted check-sub" data-i18n="opts_readonly_desc"></div></span>
      </label>
      <div style="margin-top:12px; font-weight:600;" data-i18n="opts_accounts"></div>
      <div class="oma-muted check-sub" data-i18n="opts_accounts_desc"></div>
      <div class="accounts" id="accounts"></div>
    </div>
    <label class="check">
      <input type="checkbox" id="feat-assistant" />
      <span><span data-i18n="opts_feat_assistant"></span><div class="oma-muted check-sub" data-i18n="opts_feat_assistant_desc"></div></span>
    </label>
    <label class="check">
      <input type="checkbox" id="feat-triage" />
      <span><span data-i18n="opts_feat_triage"></span><div class="oma-muted check-sub" data-i18n="opts_feat_triage_desc"></div></span>
    </label>
  </div>

  <div class="oma-card section">
    <div class="title" data-i18n="opts_sec_theme">Theme &amp; Sprache</div>
    <label class="check" style="margin-top:0;">
      <input type="checkbox" id="feat-theme" />
      <span data-i18n="opts_feat_theme"></span>
    </label>
    <div class="field">
      <label data-i18n="opts_lang_lbl">Sprache</label>
      <select class="oma-select" id="ui-lang">
        <option value="auto" data-i18n="opts_lang_auto">Auto</option>
        <option value="de">Deutsch</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="opts_theme_mode">Theme</label>
      <select class="oma-select" id="theme-mode">
        <option value="auto" data-i18n="opts_theme_auto"></option>
        <option value="omarchy" data-i18n="opts_theme_omarchy"></option>
        <option value="preset" data-i18n="opts_theme_preset"></option>
      </select>
    </div>
    <div class="field">
      <label data-i18n="opts_preset">Preset</label>
      <select class="oma-select" id="theme-preset"></select>
    </div>
    <label class="check">
      <input type="checkbox" id="theme-style-body" />
      <span><span data-i18n="opts_style_body"></span><div class="oma-muted check-sub" data-i18n="opts_style_body_desc"></div></span>
    </label>
  </div>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
