<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OmaThunder — Kanban, Spaces &amp; KI</title>
  <link rel="stylesheet" href="common.css" />
  <style id="oma-dynamic-vars"></style>
  <style>
    .layout {
      display: grid;
      grid-template-columns: 224px 1fr 348px;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      background: var(--oma-bg-dark);
      border-right: 1px solid var(--oma-border);
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
    .brand img { width: 28px; height: 28px; border-radius: 6px; }
    .brand-title { font-weight: 700; font-size: 14px; }
    .brand-sub { font-size: 11px; color: var(--oma-fg-muted); }

    .nav-group { display: flex; flex-direction: column; gap: 4px; }
    .nav-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px; border-radius: 6px; border: 1px solid transparent;
      background: transparent; color: var(--oma-fg); cursor: pointer; text-align: left;
    }
    .nav-item:hover { background: var(--oma-bg-elevated); }
    .nav-item.active {
      background: var(--oma-selection);
      border-color: color-mix(in srgb, var(--oma-accent) 45%, transparent);
    }
    .nav-count {
      font-family: var(--oma-mono); font-size: 11px; padding: 1px 7px;
      border-radius: 999px; background: var(--oma-bg-darker); color: var(--oma-fg-muted);
    }
    .nav-item.active .nav-count { color: var(--oma-accent); }

    .main { display: flex; flex-direction: column; overflow: hidden; background: var(--oma-bg); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 11px 16px; border-bottom: 1px solid var(--oma-border); background: var(--oma-bg-dark);
    }
    .topbar-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .topbar-right { display: flex; align-items: center; gap: 8px; }
    .filter-bar {
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid var(--oma-border); background: var(--oma-bg-darker);
    }
    .filter-pill {
      padding: 4px 10px; border-radius: 999px; font-size: 11.5px; cursor: pointer;
      border: 1px solid var(--oma-border); background: var(--oma-bg-dark); color: var(--oma-fg-muted);
    }
    .filter-pill.active {
      color: var(--oma-accent-fg); background: var(--oma-accent); border-color: var(--oma-accent); font-weight: 600;
    }

    .content { flex: 1; overflow: auto; padding: 14px 16px; }

    /* Kanban Board */
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(150px, 1fr));
      gap: 10px;
      min-height: 100%;
      align-items: start;
    }
    .kanban-col {
      background: var(--oma-bg-dark);
      border: 1px solid var(--oma-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 132px);
    }
    .kanban-col.drag-over {
      border-color: var(--oma-accent);
      background: color-mix(in srgb, var(--oma-selection) 35%, var(--oma-bg-dark));
    }
    .kanban-col-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 10px; border-bottom: 1px solid var(--oma-border);
      font-weight: 600; font-size: 12px;
    }
    .kanban-cards {
      padding: 8px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto;
    }
    .k-card {
      background: var(--oma-bg-elevated);
      border: 1px solid var(--oma-border);
      border-radius: 7px;
      padding: 9px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 5px;
      transition: border-color 120ms ease;
    }
    .k-card:hover { border-color: var(--oma-accent); }
    .k-card.selected {
      border-color: var(--oma-accent);
      box-shadow: inset 0 0 0 1px var(--oma-accent);
    }
    .k-card-top { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 10.5px; }
    .k-card-title { font-weight: 600; font-size: 12px; line-height: 1.3; }
    .k-card-from { font-size: 11px; color: var(--oma-fg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .k-card-sum { font-size: 11px; opacity: 0.88; line-height: 1.35; }
    .k-card-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; }
    .mini-btn {
      padding: 2px 6px; border-radius: 4px; font-size: 10.5px;
      border: 1px solid var(--oma-border); background: var(--oma-bg-darker); cursor: pointer;
    }
    .mini-btn:hover { border-color: var(--oma-accent); }

    /* Rules Table */
    .rules-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rules-table th, .rules-table td {
      padding: 9px 10px; border-bottom: 1px solid var(--oma-border); text-align: left; vertical-align: middle;
    }
    .rules-table th { color: var(--oma-fg-muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .rules-form {
      display: grid; grid-template-columns: 0.9fr 1fr 1.2fr 1.3fr auto; gap: 8px; align-items: end;
    }

    /* Right AI Drawer */
    .right-pane {
      background: var(--oma-bg-dark); border-left: 1px solid var(--oma-border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .pane-header {
      padding: 12px 14px; border-bottom: 1px solid var(--oma-border);
      font-weight: 600; display: flex; align-items: center; justify-content: space-between;
    }
    .mode-tabs {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
      padding: 8px 14px; border-bottom: 1px solid var(--oma-border); background: var(--oma-bg-darker);
    }
    .mode-tab {
      padding: 6px 4px; border-radius: 6px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--oma-border); background: transparent; cursor: pointer; text-align: center;
    }
    .mode-tab.active {
      background: var(--oma-selection); border-color: var(--oma-accent); color: var(--oma-fg);
    }
    .pane-body { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }

    .tone-row { display: flex; gap: 6px; margin-top: 6px; }
    .tone-pill {
      flex: 1; padding: 4px 6px; border-radius: 5px; font-size: 11px; cursor: pointer; text-align: center;
      border: 1px solid var(--oma-border); background: var(--oma-bg-darker);
    }
    .tone-pill.active { border-color: var(--oma-accent); background: var(--oma-selection); }

    .proposal-card {
      border: 1px solid color-mix(in srgb, var(--oma-accent) 45%, var(--oma-border));
      background: var(--oma-bg-elevated); border-radius: 8px; padding: 10px 12px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .proposal-preview {
      font-size: 11.5px; background: var(--oma-bg-darker); border: 1px solid var(--oma-border);
      border-radius: 6px; padding: 8px; white-space: pre-wrap;
    }

    .theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 10px; }
    .theme-swatch {
      border: 1px solid var(--oma-border); border-radius: 8px; padding: 10px 12px;
      cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    }
    .theme-swatch.active { outline: 2px solid var(--oma-accent); }
    .swatch-dots { display: flex; gap: 6px; }
    .swatch-dot { width: 14px; height: 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); }

    .notice { max-width: 560px; margin: 40px auto; text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
    .report-list { margin: 6px 0 0; padding-left: 18px; font-size: 11.5px; max-height: 160px; overflow-y: auto; }
    .report-list li { margin: 2px 0; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center; z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      width: 440px; max-width: 92vw; background: var(--oma-bg-elevated);
      border: 1px solid var(--oma-border); border-radius: 10px; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <img src="../icons/icon.svg" alt="OmaThunder" />
        <div>
          <div class="brand-title">OmaThunder</div>
          <div class="brand-sub" id="theme-label">Theme: Tokyo Night</div>
        </div>
      </div>

      <div class="nav-group">
        <button class="nav-item active" data-view="kanban">
          <span data-i18n="nav_kanban">Kanban-Board</span><span class="nav-count" id="cnt-kanban">0</span>
        </button>
        <button class="nav-item" data-view="rules">
          <span data-i18n="nav_rules">Spaces &amp; Filter</span><span class="nav-count" id="cnt-rules">0</span>
        </button>
        <button class="nav-item" data-view="archive">
          <span data-i18n="nav_archive">Archiv &amp; Cleanup</span><span class="nav-count" id="cnt-archive">0</span>
        </button>
        <button class="nav-item" data-view="themes">
          <span data-i18n="nav_themes">Omarchy Themes</span><span class="nav-count" id="cnt-themes">22</span>
        </button>
      </div>

      <div class="oma-card" style="margin-top:auto; font-size:11px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <span style="font-weight:600;" data-i18n="pipeline_title">KI-Pipeline</span>
          <span class="oma-badge accent" id="host-badge">Preview</span>
        </div>
        <div class="oma-muted" data-i18n="pipeline_s0">Stage 0: Domains + Header</div>
        <div class="oma-muted" id="lbl-classifier">Stage 1: gemini-4-hydrogen</div>
        <div class="oma-muted" id="lbl-agent">Stage 2: claude-cli</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <strong id="view-title">Mail-Kanban</strong>
          <span class="oma-badge ok" id="savings-badge">Stage 0</span>
          <span class="oma-badge warn" id="readonly-badge" style="display:none;" data-i18n="badge_readonly">Read-only</span>
        </div>
        <div class="topbar-right">
          <div style="display:inline-flex; border:1px solid var(--oma-border); border-radius:6px; overflow:hidden;">
            <button class="mini-btn" id="btn-lang-de" style="border:none; border-radius:0; padding:5px 8px;">DE</button>
            <button class="mini-btn" id="btn-lang-en" style="border:none; border-radius:0; padding:5px 8px;">EN</button>
          </div>
          <button class="oma-btn" id="btn-options" data-i18n="btn_settings">Einstellungen</button>
          <button class="oma-btn primary" id="btn-triage" data-i18n="btn_scan">Inbox &amp; Ordner scannen</button>
        </div>
      </header>

      <div class="filter-bar" id="space-filter-bar"></div>
      <div id="scan-report" style="display:none; padding:10px 16px 0;"></div>
      <div class="content" id="main-content"></div>
    </main>

    <aside class="right-pane">
      <div class="pane-header">
        <span data-i18n="ai_title">KI-Assistent</span>
        <span class="oma-badge warn" id="proposal-count">0 Proposals</span>
      </div>
      <div class="pane-body" id="ai-off" style="display:none;"></div>
      <div class="mode-tabs" id="ai-mode-tabs">
        <button class="mode-tab" data-aimode="summarize" data-i18n="ai_tab_summarize">Zusammenfassen</button>
        <button class="mode-tab active" data-aimode="draft_reply" data-i18n="ai_tab_draft">Formulieren</button>
        <button class="mode-tab" data-aimode="review_draft" data-i18n="ai_tab_review">Review</button>
      </div>
      <div class="pane-body" id="ai-pane-body">
        <div class="oma-card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:6px;">
            <strong id="selected-title" style="font-size:12.5px;">Mail auswählen</strong>
            <span class="oma-badge accent" id="selected-space" style="display:none;"></span>
            <button class="mini-btn" id="btn-use-displayed" style="display:none;" data-i18n="ai_use_displayed">Geöffnete Mail verwenden</button>
          </div>
          <div id="selected-meta" class="oma-muted" style="font-size:11px; margin-bottom:8px;"></div>

          <div id="tone-wrap">
            <div class="oma-muted" style="font-size:11px;" data-i18n="ai_tone">Tonfall</div>
            <div class="tone-row">
              <button class="tone-pill" data-tone="kurz" data-i18n="tone_kurz">Kurz</button>
              <button class="tone-pill active" data-tone="freundlich" data-i18n="tone_freundlich">Freundlich</button>
              <button class="tone-pill" data-tone="formal" data-i18n="tone_formal">Formal</button>
            </div>
          </div>

          <div id="draft-review-wrap" style="display:none; margin-top:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <span class="oma-muted" style="font-size:11px;" data-i18n="ai_your_draft">Dein Antwort-Entwurf</span>
              <button class="mini-btn" id="btn-load-compose" data-i18n="ai_load_compose">Aus Thunderbird laden</button>
            </div>
            <textarea class="oma-textarea" id="user-draft" rows="4" data-i18n-ph="ai_draft_ph" placeholder="Eigenen Entwurf hier einfügen oder direkt aus dem offenen Compose-Fenster laden…"></textarea>
          </div>

          <textarea class="oma-textarea" id="agent-question" rows="2" style="margin-top:8px;" data-i18n-ph="ai_question_ph" placeholder="Stichpunkte / Fokus (z. B. Donnerstag 10 Uhr zusagen, NDA erwähnen)…"></textarea>
          <div style="display:flex; justify-content:flex-end; margin-top:8px;">
            <button class="oma-btn primary" id="btn-ask">Antwort formulieren</button>
          </div>
        </div>

        <div id="agent-answer"></div>
        <div id="proposals-list" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    </aside>
  </div>

  <!-- Safe Delete Rule Confirmation Modal -->
  <div class="modal-backdrop" id="delete-modal">
    <div class="modal-box">
      <strong style="font-size:14px;" data-i18n="del_modal_title">Zuordnung löschen?</strong>
      <div id="delete-modal-text" class="oma-muted"></div>
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="chk-revert-incoming" />
        <span data-i18n-html="del_modal_revert">Per Auto-Move einsortierte Mails wieder zurück in <strong>Incoming (INBOX)</strong> verschieben</span>
      </label>
      <div class="oma-muted" id="revert-ro-note" style="display:none; font-size:11.5px;" data-i18n="del_modal_revert_ro"></div>
      <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
        <button class="oma-btn ghost" id="btn-cancel-del" data-i18n="btn_cancel">Abbrechen</button>
        <button class="oma-btn primary" id="btn-confirm-del" data-i18n="rules_btn_delete">Löschen</button>
      </div>
    </div>
  </div>

  <script src="../lib/core.js"></script>
  <script src="i18n.js"></script>
  <script src="space.js"></script>
</body>
</html>
